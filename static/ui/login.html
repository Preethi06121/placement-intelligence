<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Placement Intelligence</title>
  <link rel="stylesheet" href="/static/ui/css/main.css" />
</head>
<body class="auth-page">
  <div class="auth-inner">
    <p class="site-title">Placement Intelligence</p>
    <div class="card">
      <h1>Login</h1>
      <form id="form-login">
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" required autocomplete="current-password" />
        </div>
        <p id="form-err" class="error" hidden></p>
        <button type="submit" class="btn">Login</button>
      </form>
      <p class="muted" style="margin-top: 20px; text-align: center">
        <a href="/app/signup">Create an account</a>
      </p>
    </div>
  </div>
  <script src="/static/ui/js/api.js"></script>
  <script src="/static/ui/js/login.js"></script>
</body>
</html>
