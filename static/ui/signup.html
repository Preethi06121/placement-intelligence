<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — Placement Intelligence</title>
  <link rel="stylesheet" href="/static/ui/css/main.css" />
</head>
<body class="auth-page">
  <div class="auth-inner">
    <p class="site-title">Placement Intelligence</p>
    <div class="card">
      <h1>Sign up</h1>
      <form id="form-signup">
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" required autocomplete="new-password" />
        </div>
        <p id="form-err" class="error" hidden></p>
        <button type="submit" class="btn">Create account</button>
      </form>
      <p class="muted" style="margin-top: 20px; text-align: center">
        <a href="/app/login">Back to login</a>
      </p>
    </div>
  </div>
  <script src="/static/ui/js/api.js"></script>
  <script src="/static/ui/js/signup.js"></script>
</body>
</html>
